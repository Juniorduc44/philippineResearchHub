<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>God's Eye — operator watch</title>
  <style>
    html, body { margin: 0; background: #0b0d10; color: #d7dde8; font-family: ui-sans-serif, system-ui, sans-serif; }
    header { padding: 12px 18px; border-bottom: 1px solid #222; }
    h1 { font-size: 16px; margin: 0 0 6px; }
    p { margin: 0; font-size: 13px; opacity: 0.8; }
    img { display: block; width: 100%; height: auto; background: #111; }
    a { color: #8ec8ff; }
  </style>
</head>
<body>
  <header>
    <h1>Operator watch (headless Chromium screenshots)</h1>
    <p>
      Live globe you can drive yourself:
      <a href="http://127.0.0.1:4173/?welcome=0#v=2&amp;lat=10.3307983&amp;lon=123.9068258&amp;alt=4500&amp;heading=20&amp;pitch=-55">open Cebu IT Park on :4173</a>

  </header>
  <img id="shot" alt="latest operator screenshot" src="latest.png?t=0" />
  <script>
    const img = document.getElementById('shot');
    setInterval(() => { img.src = 'latest.png?t=' + Date.now(); }, 2000);
  </script>
